name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  # 화면 + 방 서버(Durable Object)를 Cloudflare Workers로
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: 토큰이 없으면 배포 건너뜀
        id: token
        run: echo "ok=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.token.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

  # 예전 주소(e-jiwon.github.io/code-race)로 들어오면 새 주소로 넘김 — 이미 공유된 초대 링크도 그대로 동작
  pages-redirect:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - run: |
          mkdir site
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>코드 타자 레이스</title>
          <script>location.replace('https://code-race.jinsang-defense.workers.dev/' + location.search)</script>
          <a href="https://code-race.jinsang-defense.workers.dev/">코드 타자 레이스로 이동</a>
          HTML
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
